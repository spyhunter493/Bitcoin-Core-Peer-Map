name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Python syntax
        run: python -m compileall -q bitcoin_peer_map tests
      - name: Check shell scripts
        run: |
          bash -n bpm.sh lib/*.sh scripts/*.sh tests/*.sh
          sh -n docker-entrypoint.sh
          shellcheck -x -S error bpm.sh docker-entrypoint.sh lib/*.sh scripts/*.sh tests/*.sh
      - name: Check JavaScript syntax
        run: node --check bitcoin_peer_map/static/js/app.js && node --check bitcoin_peer_map/static/js/as-diversity.js && node --check tests/test_as_diversity.js
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run JavaScript tests
        run: node tests/test_as_diversity.js
      - name: Run shell tests
        run: bash tests/test_config.sh
      - name: Validate Docker build
        env:
          BITCOIN_RPC_USER: test
          BITCOIN_RPC_PASSWORD: test
        run: |
          docker compose -f compose.example.yaml config --quiet
          docker build --tag bitcoin-peer-map:test .
