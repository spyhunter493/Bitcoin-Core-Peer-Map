name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install --editable ".[test]"
      - name: Check Python
        run: |
          python -m compileall -q src tests
          ruff format --check src tests
          ruff check src tests
      - name: Check JavaScript
        run: node --check src/bitcoin_peer_map/static/js/app.js && node --check src/bitcoin_peer_map/static/js/as-diversity.js && node --check tests/test_as_diversity.js
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run JavaScript tests
        run: node tests/test_as_diversity.js
      - name: Validate container
        env:
          BITCOIN_RPC_USER: test
          BITCOIN_RPC_PASSWORD: test
        run: |
          docker compose config --quiet
          docker build --tag bitcoin-peer-map:test .
