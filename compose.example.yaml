name: bitcoin-peer-map

services:
  bpm:
    build:
      context: .
    image: bitcoin-peer-map:local
    restart: unless-stopped
    environment:
      BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST:-bitcoin}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-8332}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD}
      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-main}
      BPM_LISTEN_PORT: ${BPM_LISTEN_PORT:-58333}
      BPM_LISTEN_ADDRESS: ${BPM_LISTEN_ADDRESS:-0.0.0.0}
      BPM_GEOIP_ENABLED: ${BPM_GEOIP_ENABLED:-}
      BPM_GEOIP_AUTO_UPDATE: ${BPM_GEOIP_AUTO_UPDATE:-}
    ports:
      - "${BPM_HOST_PORT:-58333}:${BPM_LISTEN_PORT:-58333}"
    volumes:
      - bpm-data:/var/lib/bitcoin-peer-map
    networks:
      - bitcoin-rpc

volumes:
  bpm-data:
    name: bitcoin-peer-map-data

networks:
  bitcoin-rpc:
    external: true
